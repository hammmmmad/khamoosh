<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarfraz Khamoosh | در حال بروزرسانی</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
overflow:hidden;
color:white;

}

.container{

width:90%;
max-width:650px;
padding:50px;
border-radius:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
text-align:center;
box-shadow:0 25px 60px rgba(0,0,0,.35);

}

.logo{

font-size:38px;
margin-bottom:20px;

}

h1{

font-size:40px;
margin-bottom:15px;

}

p{

font-size:18px;
line-height:2;
opacity:.9;

}

.loader{

margin:45px auto;
width:85px;
height:85px;
border-radius:50%;
border:8px solid rgba(255,255,255,.15);
border-top:8px solid #ffffff;
animation:spin 1s linear infinite;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

.progress{

width:100%;
height:10px;
background:rgba(255,255,255,.15);
border-radius:50px;
overflow:hidden;
margin-top:35px;

}

.progress span{

display:block;
height:100%;
width:65%;
background:white;
border-radius:50px;
animation:loading 3s ease infinite;

}

@keyframes loading{

0%{width:10%;}
50%{width:70%;}
100%{width:100%;}

}

.footer{

margin-top:35px;
font-size:15px;
opacity:.75;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">🛠️</div>

<h1>وب‌سایت در حال بروزرسانی است</h1>

<p>

کاربران گرامی،<br>

وب‌سایت <strong>Sarfraz Khamoosh</strong> جهت ارائه امکانات جدید، افزایش سرعت، بهبود امنیت و طراحی حرفه‌ای‌تر، در حال بروزرسانی می‌باشد.

<br><br>

به‌زودی با نسخه‌ای مدرن و قدرتمند بازخواهیم گشت.

</p>

<div class="loader"></div>

<div class="progress">
<span></span>
</div>

<div class="footer">

© 2026 Sarfraz Khamoosh — All Rights Reserved

</div>

</div>

</body>
</html>
