<!DOCTYPE html>
<html lang="en">
<head>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Sarfraz Khamoosh | Premium Immigration News">

    <meta property="og:url" content="https://khamoosh.abrdns.com/">

    <link rel="manifest" href="manifest.json">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 'poppins': ['Poppins', 'sans-serif'] },
                    colors: { 'brand-blue': '#2563eb', 'brand-light': '#eff6ff' }
                }
            }
        }

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Sarfraz Khamoosh",
      "url": "https://khamoosh.abrdns.com",
      "logo": "https://khamoosh.abrdns.com/logo.png",

<body class="bg-brand-light dark:bg-slate-900 font-poppins transition-colors duration-300">

    <!-- Desktop Top Navigation -->

        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">

            <div class="nav-item-placeholder"></div>

            </a>
            <a href="#/contact" class="nav-item">
