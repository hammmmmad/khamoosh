<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>اشعار | سرفراز خموش</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Ignogito';
            src: url('fonts/ignogito.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Segoe UI', system-ui, sans-serif;
            background: #f0f2f8;
            color: #1e2a3e;
            min-height: 100vh;
            transition: background 0.3s;
        }

        body.dark {
            background: #0a0a0f;
        }

        .glass-header {
            position: sticky;
            top: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 0.7rem 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
        }

        body.dark .glass-header {
            background: rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        body.dark .navbar,
        body.dark .nav-menu a,
        body.dark .lang-btn,
        body.dark .lang-btn span,
        body.dark .hamburger,
        body.dark .nav-actions {
            color: #ffffff;
        }

        body.dark .nav-menu a img,
        body.dark .hamburger img,
        body.dark .lang-btn img {
            filter: brightness(0) invert(1);
        }

        body.dark .logo-img {
            filter: none;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }

        .site-name h1 {
            font-family: 'Ignogito', 'Vazirmatn', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .site-name p {
            font-size: 0.65rem;
            opacity: 0.8;
        }

        .hamburger {
            display: none;
            background: rgba(255, 255, 240, 0.3);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }

        .hamburger img {
            width: 24px;
            height: 24px;
        }

        .nav-menu {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-menu a {
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        body:not(.dark) .nav-menu a {
            color: #1e2a3e;
        }

        body.dark .nav-menu a {
            color: #eef2ff;
        }

        .nav-menu a:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .nav-menu a img {
            width: 20px;
            height: 20px;
        }

        .nav-actions {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .theme-btn {
            background: rgba(255, 255, 240, 0.3);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-btn img {
            width: 28px;
            height: 28px;
        }

        .lang-selector {
            position: relative;
        }

        .lang-btn {
            background: rgba(255, 255, 240, 0.3);
            border: none;
            border-radius: 2rem;
            padding: 0 1rem;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .lang-btn img {
            width: 20px;
            height: 20px;
        }

        .lang-dropdown {
            position: absolute;
            top: 110%;
            right: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 1rem;
            min-width: 130px;
            display: none;
            z-index: 200;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .lang-selector.open .lang-dropdown {
            display: block;
        }

        .lang-option {
            padding: 8px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }

        .lang-option img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .lang-option:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .categories-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: #1e2a3e;
        }

        body.dark .cat-btn {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
            color: #eef2ff;
        }

        .cat-btn.active {
            background: #8b5cf6;
            color: white;
            border-color: #8b5cf6;
        }

        body.dark .cat-btn.active {
            background: #8b5cf6;
            color: white;
        }

        .category-section {
            margin-bottom: 2.5rem;
        }

        .category-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            padding-right: 1rem;
            border-right: 5px solid #8b5cf6;
        }

        body:not(.dark) .category-title {
            color: #1e2a3e;
        }

        body.dark .category-title {
            color: #f0f0f0;
        }

        .poems-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .poem-card {
            border-radius: 2rem;
            padding: 1.5rem;
            transition: transform 0.25s, box-shadow 0.25s, background 0.3s, backdrop-filter 0.3s;
            position: relative;
            overflow: hidden;
        }

        body:not(.dark) .poem-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
        }

        body.dark .poem-card {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
        }

        .poem-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .poem-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15);
        }

        .poem-type {
            font-size: 0.7rem;
            background: rgba(0, 0, 0, 0.05);
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        body:not(.dark) .poem-type {
            color: #2d3a4e;
            background: rgba(0, 0, 0, 0.05);
        }

        body.dark .poem-type {
            color: #ddd;
            background: #2d3a4e;
        }

        .poem-text {
            font-size: 0.95rem;
            line-height: 1.8;
            text-align: center;
            white-space: pre-line;
            margin-bottom: 1rem;
        }

        body:not(.dark) .poem-text {
            color: #2d3a4e;
        }

        body.dark .poem-text {
            color: #e0e0e0;
        }

        .card-actions {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.dark .card-actions {
            border-top-color: rgba(255, 255, 255, 0.2);
        }

        .card-actions button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 12px;
            border-radius: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        body:not(.dark) .card-actions button {
            color: #1e2a3e;
            background: rgba(0, 0, 0, 0.05);
        }

        body.dark .card-actions button {
            color: #e0e0e0;
            background: rgba(255, 255, 255, 0.1);
        }

        .card-actions button:hover {
            background: #8b5cf6;
            color: white;
        }

        .card-actions button img {
            width: 18px;
            height: 18px;
        }

        body:not(.dark) .card-actions button img {
            filter: brightness(0) contrast(1);
        }

        body.dark .card-actions button img {
            filter: brightness(0) invert(1);
        }

        .like-btn.liked {
            background: #ef4444;
            color: white;
        }

        .like-btn.liked img {
            filter: brightness(0) invert(1);
        }

        .like-count {
            margin-left: 4px;
            font-size: 0.75rem;
        }

        .glass-footer {
            margin-top: 3rem;
            border-radius: 2rem 2rem 1rem 1rem;
            padding: 2rem 1.5rem 1.5rem;
            transition: all 0.3s;
        }

        body:not(.dark) .glass-footer {
            background: #ffffff;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
            border-top: 1px solid #e5e7eb;
        }

        body:not(.dark) .footer-content,
        body:not(.dark) .copyright {
            color: #1e2a3e;
        }

        body:not(.dark) .social-icons a,
        body:not(.dark) .codm-btn {
            background: #f3f4f6;
        }

        body:not(.dark) .social-icons a img,
        body:not(.dark) .codm-btn img {
            filter: brightness(0) contrast(1);
        }

        body.dark .glass-footer {
            background: #0a0a0f;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.dark .footer-content,
        body.dark .copyright {
            color: #eef2ff;
        }

        body.dark .social-icons a,
        body.dark .codm-btn {
            background: #1f2937;
        }

        body.dark .social-icons a img,
        body.dark .codm-btn img {
            filter: brightness(0) invert(1);
        }

        body.dark .social-icons a:hover,
        body.dark .codm-btn:hover {
            background: #f97316 !important;
        }

        .footer-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
        }

        .social-icons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .social-icons a,
        .codm-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            text-decoration: none;
            cursor: pointer;
        }

        .social-icons a img,
        .codm-btn img {
            width: 24px;
            height: 24px;
        }

        .copyright {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0.8rem;
            }
            .navbar {
                position: relative;
            }
            .hamburger {
                display: flex;
            }
            .nav-menu {
                display: none;
                position: absolute;
                top: calc(100% + 10px);
                left: 0;
                right: 0;
                background: rgba(255, 255, 255, 0.97);
                backdrop-filter: blur(20px);
                flex-direction: column;
                align-items: stretch;
                gap: 0.3rem;
                padding: 1rem;
                border-radius: 1.5rem;
                z-index: 9999;
                box-shadow: 0 20px 30px rgba(0, 0, 0, 0.2);
                border: 1px solid rgba(0, 0, 0, 0.1);
            }
            body.dark .nav-menu {
                background: rgba(0, 0, 0, 0.95);
                border-color: rgba(255, 255, 255, 0.2);
                color: white;
            }
            body.dark .nav-menu a img {
                filter: brightness(0) invert(1);
            }
            .nav-menu.open {
                display: flex;
            }
            .nav-menu a {
                justify-content: center;
                padding: 0.7rem;
            }
            .lang-btn span:not(.lang-text) {
                display: none;
            }
            .lang-btn {
                padding: 0 0.9rem;
            }
            .poems-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .categories-bar {
                gap: 0.7rem;
            }
            .cat-btn {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .footer-content {
                flex-direction: column;
                text-align: center;
            }
            .social-icons {
                justify-content: center;
            }
        }

        .glass-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 1.8rem;
            text-align: center;
            width: 85%;
            max-width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
        }

        body.dark .modal-content {
            background: rgba(0, 0, 0, 0.85);
            color: white;
        }

        .modal-content code {
            display: inline-block;
            background: #2d3a4e;
            padding: 8px 12px;
            border-radius: 12px;
            margin: 10px 0;
            direction: ltr;
            color: white;
        }

        .modal-buttons button {
            background: #8b5cf6;
            border: none;
            padding: 8px 20px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            margin: 0 5px;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            z-index: 2000;
            animation: fadeOut 2s ease forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>

    <script>
        const categoriesData = {
            mystical: { fa: "اشعار عارفانه", en: "Mystical Poems" },
            romantic: { fa: "اشعار عاشقانه", en: "Romantic Poems" },
            oritic: { fa: "اشعار اورتیک", en: "Oritic Poems" },
            blank: { fa
